name: Web

on:
  push:
    paths:
      - "web/**"
      - "deploy/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "deploy/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare example environment
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose -f deploy/compose.yaml --env-file .env.example config --quiet
      - name: Validate Caddy routes
        run: >-
          docker run --rm
          -e SERVER_ADDRESS=http://localhost
          -e APP_ACCESS_TOKEN=test-token
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine
          caddy validate --config /etc/caddy/Caddyfile
