name: AIChallenge

options:
  bundleIdPrefix: dev.eugeneapple
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AIChallenge:
    type: application
    platform: iOS
    sources:
      - path: AIChallenge
        excludes:
          - Resources
    resources:
      - path: AIChallenge/Resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eugeneapple.aichallenge
        PRODUCT_NAME: AIChallenge
        INFOPLIST_FILE: AIChallenge/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - AIChallengeTests

  AIChallengeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIChallengeTests
    dependencies:
      - target: AIChallenge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eugeneapple.aichallenge.tests
        GENERATE_INFOPLIST_FILE: YES
