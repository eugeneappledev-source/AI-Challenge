services:
  api:
    build:
      context: ../backend
    env_file:
      - ../.env
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - app-network

  web:
    build:
      context: ../web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network

  caddy:
    image: caddy:2.10-alpine
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-http://localhost}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api
      - web
    networks:
      - app-network

networks:
  app-network:

volumes:
  caddy_data:
  caddy_config:
