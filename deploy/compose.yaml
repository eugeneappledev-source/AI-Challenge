services:
  agent-data-init:
    image: caddy:2.10-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 65532:65532 /data"]
    restart: "no"
    volumes:
      - agent_data:/data

  api:
    build:
      context: ../backend
    env_file:
      - ../.env
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      AGENT_DB_PATH: /data/agent.db
    volumes:
      - agent_data:/data
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
    networks:
      - app-network

  web:
    build:
      context: ../web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network

  caddy:
    image: caddy:2.10-alpine
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-http://localhost}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api
      - web
    networks:
      - app-network

networks:
  app-network:

volumes:
  agent_data:
  caddy_data:
  caddy_config:
